<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>three.js</title>

  <link
    rel="icon"
    type="image/png"
    href="https://raw.githubusercontent.com/joaoTYSM/three.js/refs/heads/main/icon.png"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-dark.min.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
  >

  <style>
    :root {
      color-scheme: dark;

      --bg: #0d1117;
      --text: #f0f6fc;
      --muted: #8b949e;
      --border: #30363d;
      --surface: #161b22;
      --surface-hover: #21262d;
      --link: #f0f6fc;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: var(--bg);
      color: var(--text);

      transition:
        background-color .25s ease,
        color .25s ease;
    }

    .markdown-body {
      width: min(980px, calc(100% - 40px));
      margin: 0 auto;
      padding: 60px 0 80px;

      background: transparent !important;
      color: var(--text);
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      color: var(--text) !important;
      border-bottom-color: var(--border);
    }

    .markdown-body h1 a,
    .markdown-body h2 a,
    .markdown-body h3 a,
    .markdown-body h4 a,
    .markdown-body h5 a,
    .markdown-body h6 a {
      color: var(--text) !important;
      text-decoration: none;
    }

    .markdown-body h1 a:hover,
    .markdown-body h2 a:hover,
    .markdown-body h3 a:hover,
    .markdown-body h4 a:hover,
    .markdown-body h5 a:hover,
    .markdown-body h6 a:hover {
      color: #ffffff !important;
    }

    .markdown-body p,
    .markdown-body li,
    .markdown-body strong,
    .markdown-body em {
      color: var(--text);
    }

    .markdown-body a {
      color: var(--link);
    }

    .markdown-body a:hover {
      color: #ffffff;
    }

    .markdown-body blockquote {
      color: var(--muted);
      border-left-color: var(--border);
    }

    .markdown-body hr {
      background-color: var(--border);
    }

    .markdown-body table {
      display: block;
      width: 100%;
      overflow-x: auto;
    }

    .markdown-body table th,
    .markdown-body table td {
      border-color: var(--border);
    }

    .markdown-body table tr {
      background: transparent;
      border-color: var(--border);
    }

    .markdown-body table tr:nth-child(2n) {
      background: var(--surface);
    }

    .markdown-body code {
      background: var(--surface);
      color: var(--text);
    }

    .markdown-body pre {
      position: relative;

      padding: 16px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;

      overflow-x: auto;
    }

    .markdown-body pre code {
      background: transparent;
      color: inherit;
    }

    .markdown-body img {
      max-width: 100%;
      height: auto;
    }

    .markdown-body details {
      margin: 14px 0;
      padding: 12px 16px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .markdown-body details > summary {
      cursor: pointer;
      font-weight: 600;
    }

    .markdown-body kbd {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .markdown-body input[type="checkbox"] {
      accent-color: #8b949e;
    }

    .markdown-body .task-list-item {
      list-style-type: none;
    }

    .markdown-body .task-list-item input {
      margin-right: 7px;
    }

    .markdown-body .footnotes {
      color: var(--muted);
      font-size: .9em;
    }

    .markdown-body .footnote-ref {
      text-decoration: none;
    }

    .markdown-body .footnote-backref {
      text-decoration: none;
    }

    .code-wrapper {
      position: relative;
    }

    .copy-code {
      position: absolute;

      top: 8px;
      right: 8px;

      z-index: 5;

      height: 30px;
      padding: 0 9px;

      border: 1px solid var(--border);
      border-radius: 6px;

      background: var(--surface);
      color: var(--muted);

      cursor: pointer;

      font:
        12px
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      opacity: 0;

      transition:
        opacity .15s ease,
        background .15s ease,
        color .15s ease;
    }

    .code-wrapper:hover .copy-code {
      opacity: 1;
    }

    .copy-code:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .github-alert {
      margin: 16px 0;
      padding: 12px 16px;

      border-left: 4px solid var(--border);
      border-radius: 6px;

      background: var(--surface);
    }

    .github-alert-title {
      margin-bottom: 6px;

      font-weight: 600;
      color: var(--text);
    }

    .github-alert-note {
      border-left-color: #58a6ff;
    }

    .github-alert-tip {
      border-left-color: #3fb950;
    }

    .github-alert-important {
      border-left-color: #a371f7;
    }

    .github-alert-warning {
      border-left-color: #d29922;
    }

    .github-alert-caution {
      border-left-color: #f85149;
    }

    .mermaid {
      margin: 20px 0;
      padding: 16px;

      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;

      overflow-x: auto;
    }

    .math-block {
      margin: 18px 0;
      overflow-x: auto;
      text-align: center;
    }

    #loading {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 26px;
      height: 26px;

      border: 3px solid var(--border);
      border-top-color: #8b949e;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 700px) {
      .markdown-body {
        width: calc(100% - 28px);
        padding: 50px 0 50px;

        font-size: 15px;
      }

      .markdown-body pre {
        margin-left: -4px;
        margin-right: -4px;
      }
    }
  </style>
</head>

<body>

  <main
    id="content"
    class="markdown-body"
  >
    <div id="loading">
      <div class="spinner"></div>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.umd.js"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"
  ></script>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/mermaid@11.12.1/dist/mermaid.min.js"
  ></script>

  <script>
    const README_URL =
      "https://raw.githubusercontent.com/joaoTYSM/three.js/refs/heads/main/README.md";

    const REPOSITORY_URL =
      "https://github.com/joaoTYSM/three.js";

    const REPOSITORY_RAW =
      "https://raw.githubusercontent.com/joaoTYSM/three.js/refs/heads/main/";

    const content =
      document.getElementById("content");

    marked.setOptions({
      gfm: true,
      breaks: false,
      pedantic: false
    });

    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      securityLevel: "strict"
    });

    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/<[^>]*>/g, "")
        .replace(/[^\w\s-]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-");
    }

    function resolveURL(url, type) {
      if (!url) {
        return url;
      }

      if (
        url.startsWith("#") ||
        url.startsWith("data:") ||
        url.startsWith("mailto:") ||
        url.startsWith("tel:") ||
        url.startsWith("//") ||
        /^[a-z][a-z0-9+.-]*:/i.test(url)
      ) {
        return url;
      }

      if (type === "image") {
        return new URL(
          url,
          REPOSITORY_RAW
        ).href;
      }

      return new URL(
        url,
        REPOSITORY_URL + "/blob/main/"
      ).href;
    }

    function fixURLs(root) {
      root
        .querySelectorAll("img")
        .forEach(img => {
          const src =
            img.getAttribute("src");

          if (src) {
            img.src =
              resolveURL(
                src,
                "image"
              );
          }

          img.loading = "lazy";
        });

      root
        .querySelectorAll("a")
        .forEach(a => {
          const href =
            a.getAttribute("href");

          if (!href) {
            return;
          }

          if (href.startsWith("#")) {
            return;
          }

          a.href =
            resolveURL(
              href,
              "link"
            );

          a.target = "_blank";
          a.rel =
            "noopener noreferrer";
        });
    }

    function addHeadingIDs(root) {
      const used = new Set();

      root
        .querySelectorAll(
          "h1, h2, h3, h4, h5, h6"
        )
        .forEach(heading => {

          let id =
            slugify(
              heading.textContent
            );

          if (!id) {
            return;
          }

          const original = id;
          let count = 2;

          while (used.has(id)) {
            id =
              original +
              "-" +
              count++;
          }

          used.add(id);
          heading.id = id;
        });
    }

    function addCopyButtons(root) {
      root
        .querySelectorAll("pre")
        .forEach(pre => {

          if (
            pre.parentElement.classList.contains(
              "code-wrapper"
            )
          ) {
            return;
          }

          const wrapper =
            document.createElement("div");

          wrapper.className =
            "code-wrapper";

          pre.parentNode.insertBefore(
            wrapper,
            pre
          );

          wrapper.appendChild(pre);

          const button =
            document.createElement("button");

          button.className =
            "copy-code";

          button.type = "button";
          button.textContent = "Copy";

          button.addEventListener(
            "click",
            async () => {

              const code =
                pre.querySelector("code");

              const text =
                code
                  ? code.textContent
                  : pre.textContent;

              try {

                await navigator.clipboard.writeText(
                  text
                );

                button.textContent =
                  "Copied";

                setTimeout(
                  () => {
                    button.textContent =
                      "Copy";
                  },
                  1200
                );

              } catch {

                button.textContent =
                  "Failed";

                setTimeout(
                  () => {
                    button.textContent =
                      "Copy";
                  },
                  1200
                );
              }
            }
          );

          wrapper.appendChild(button);
        });
    }

    function highlight(root) {
      root
        .querySelectorAll("pre code")
        .forEach(code => {

          if (
            code.classList.contains(
              "language-mermaid"
            )
          ) {
            return;
          }

          try {
            hljs.highlightElement(code);
          } catch {}
        });
    }

    function renderMermaid(root) {
      const blocks =
        root.querySelectorAll(
          "pre code.language-mermaid"
        );

      blocks.forEach((code, index) => {

        const container =
          document.createElement("div");

        container.className =
          "mermaid";

        container.textContent =
          code.textContent;

        code.parentElement.replaceWith(
          container
        );
      });

      if (blocks.length) {
        mermaid.run({
          nodes:
            root.querySelectorAll(
              ".mermaid"
            )
        });
      }
    }

    function renderMath(root) {
      root
        .querySelectorAll(
          "code.language-math"
        )
        .forEach(code => {

          const expression =
            code.textContent;

          const container =
            document.createElement("span");

          try {
            katex.render(
              expression,
              container,
              {
                throwOnError: false,
                displayMode: true
              }
            );

            container.className =
              "math-block";

            code.parentElement.replaceWith(
              container
            );

          } catch {}
        });
    }

    function renderInlineMath(root) {
      const walker =
        document.createTreeWalker(
          root,
          NodeFilter.SHOW_TEXT
        );

      const nodes = [];

      while (walker.nextNode()) {
        const node =
          walker.currentNode;

        if (
          node.parentElement &&
          !node.parentElement.closest(
            "pre, code, script, style"
          )
        ) {
          nodes.push(node);
        }
      }

      nodes.forEach(node => {

        const text =
          node.nodeValue;

        if (!text.includes("$")) {
          return;
        }

        const regex =
          /\$([^$\n]+)\$/g;

        if (!regex.test(text)) {
          return;
        }

        regex.lastIndex = 0;

        const fragment =
          document.createDocumentFragment();

        let last = 0;
        let match;

        while (
          (match = regex.exec(text))
        ) {

          fragment.appendChild(
            document.createTextNode(
              text.slice(
                last,
                match.index
              )
            )
          );

          const span =
            document.createElement("span");

          try {

            katex.render(
              match[1],
              span,
              {
                throwOnError: false,
                displayMode: false
              }
            );

            fragment.appendChild(span);

          } catch {

            fragment.appendChild(
              document.createTextNode(
                match[0]
              )
            );
          }

          last =
            regex.lastIndex;
        }

        fragment.appendChild(
          document.createTextNode(
            text.slice(last)
          )
        );

        node.parentNode.replaceChild(
          fragment,
          node
        );
      });
    }

    function processAlerts(root) {
      root
        .querySelectorAll("blockquote")
        .forEach(blockquote => {

          const first =
            blockquote.querySelector(
              "p"
            );

          if (!first) {
            return;
          }

          const text =
            first.textContent.trim();

          const match =
            text.match(
              /^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i
            );

          if (!match) {
            return;
          }

          const type =
            match[1].toLowerCase();

          const alert =
            document.createElement("div");

          alert.className =
            "github-alert github-alert-" +
            type;

          const title =
            document.createElement("div");

          title.className =
            "github-alert-title";

          title.textContent =
            type.charAt(0).toUpperCase() +
            type.slice(1);

          alert.appendChild(title);

          while (
            blockquote.firstChild
          ) {

            const child =
              blockquote.firstChild;

            if (
              child === first
            ) {

              const clone =
                first.cloneNode(true);

              clone.textContent =
                clone.textContent
                  .replace(
                    /^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i,
                    ""
                  );

              alert.appendChild(
                clone
              );

            } else {

              alert.appendChild(
                child
              );
            }
          }

          blockquote.replaceWith(
            alert
          );
        });
    }

    function sanitizeMarkdown(html) {
      return DOMPurify.sanitize(
        html,
        {
          USE_PROFILES: {
            html: true
          },

          ADD_TAGS: [
            "details",
            "summary",
            "kbd",
            "sub",
            "sup",
            "ins",
            "del",
            "picture",
            "source"
          ],

          ADD_ATTR: [
            "target",
            "rel",
            "loading",
            "open",
            "align",
            "colspan",
            "rowspan",
            "width",
            "height",
            "start",
            "reversed",
            "type"
          ]
        }
      );
    }

    async function loadREADME() {
      try {

        const response =
          await fetch(
            README_URL,
            {
              cache: "no-cache"
            }
          );

        if (!response.ok) {
          throw new Error(
            "Failed to fetch README"
          );
        }

        const markdown =
          await response.text();

        const html =
          marked.parse(
            markdown
          );

        const safe =
          sanitizeMarkdown(
            html
          );

        content.innerHTML =
          safe;

        fixURLs(
          content
        );

        addHeadingIDs(
          content
        );

        processAlerts(
          content
        );

        renderMath(
          content
        );

        renderInlineMath(
          content
        );

        highlight(
          content
        );

        renderMermaid(
          content
        );

        addCopyButtons(
          content
        );

      } catch (error) {

        content.innerHTML = `
          <h1>Failed to load README</h1>

          <p>
            The README could not be loaded.
          </p>

          <p>
            <a
              href="${README_URL}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Open README
            </a>
          </p>
        `;

        console.error(
          error
        );
      }
    }

    loadREADME();
  </script>

</body>
</html>
